version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: assignment3db
      MYSQL_USER: flask_user
      MYSQL_PASSWORD: flaskpass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  flask-api:
    build: ./flask-api
    environment:
      DB_HOST: mysql
      DB_NAME: assignment3db
      DB_USER: flask_user
      DB_PASSWORD: flaskpass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - flask-api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
